<title>PolyFEM Config Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-alt: #fafbfc;
    --border: #dde1e6;
    --border-soft: #e8eaed;
    --text: #1c2129;
    --text-dim: #5b6472;
    --text-faint: #8891a0;
    --accent: #2461e8;
    --accent-dim: #e8eefd;
    --required: #a5680a;
    --required-bg: #fdf3e0;
    --danger: #b5432f;
    --danger-bg: #fbeae6;
    --code-bg: #0e1420;
    --code-text: #d8e0ee;
    --code-key: #7fb0ff;
    --code-str: #9fd88a;
    --shadow: 0 1px 2px rgba(20, 24, 32, 0.06), 0 1px 1px rgba(20,24,32,0.04);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c;
      --panel: #1b1f26;
      --panel-alt: #20242c;
      --border: #2c313b;
      --border-soft: #262a33;
      --text: #e7eaf0;
      --text-dim: #9aa3b2;
      --text-faint: #6b7382;
      --accent: #5b8dff;
      --accent-dim: #1c2740;
      --required: #e0a746;
      --required-bg: #2c2411;
      --danger: #e0796a;
      --danger-bg: #2f1a16;
      --code-bg: #0a0e15;
      --code-text: #d8e0ee;
      --code-key: #7fb0ff;
      --code-str: #9fd88a;
      --shadow: 0 1px 2px rgba(0,0,0,0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171c;
    --panel: #1b1f26;
    --panel-alt: #20242c;
    --border: #2c313b;
    --border-soft: #262a33;
    --text: #e7eaf0;
    --text-dim: #9aa3b2;
    --text-faint: #6b7382;
    --accent: #5b8dff;
    --accent-dim: #1c2740;
    --required: #e0a746;
    --required-bg: #2c2411;
    --danger: #e0796a;
    --danger-bg: #2f1a16;
    --code-bg: #0a0e15;
    --code-text: #d8e0ee;
    --code-key: #7fb0ff;
    --code-str: #9fd88a;
    --shadow: 0 1px 2px rgba(0,0,0,0.4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .app-shell {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 100vh;
  }

  header.topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-right: 6px;
  }
  .brand-mark {
    font-family: "JetBrains Mono", monospace;
    font-weight: 600;
    font-size: 15px;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .brand-name {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .toolbar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--panel-alt);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .btn:hover { background: var(--border-soft); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-add {
    color: var(--accent);
    border-color: var(--accent-dim);
    background: var(--accent-dim);
  }
  .btn-remove {
    color: var(--danger);
    background: transparent;
    border-color: transparent;
  }
  .btn-remove:hover { background: var(--danger-bg); }
  .btn-small { padding: 2px 8px; font-size: 12px; }

  .current-file {
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-left: auto;
    white-space: nowrap;
  }

  main.layout {
    display: flex;
    flex: 1;
    min-height: 0;
    gap: 1px;
    background: var(--border);
  }
  .pane {
    background: var(--bg);
    overflow-y: auto;
    flex: 1;
    min-width: 0;
  }
  .pane-left { flex: 1.3; }
  .pane-right { flex: 1; display: flex; flex-direction: column; }

  .pane-header {
    position: sticky;
    top: 0;
    background: var(--panel);
    border-bottom: 1px solid var(--border-soft);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 5;
  }
  .pane-title {
    font-weight: 600;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }
  .pane-body { padding: 16px 18px 60px; }

  /* form */
  .obj-fields {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  details.field {
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    background: var(--panel);
    box-shadow: var(--shadow);
  }
  details.field > summary.field-summary {
    list-style: none;
    cursor: pointer;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    font-weight: 500;
    user-select: none;
  }
  details.field > summary::-webkit-details-marker { display: none; }
  details.field > summary::before {
    content: "\25b8";
    display: inline-block;
    color: var(--text-faint);
    transition: transform 0.1s;
    width: 10px;
  }
  details.field[open] > summary::before { transform: rotate(90deg); }
  .field-key { color: var(--text); }
  .req-star { color: var(--required); font-weight: 700; }
  .field-body {
    padding: 4px 14px 12px 30px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .field-doc {
    margin: 0 0 2px;
    color: var(--text-dim);
    font-size: 12.5px;
    line-height: 1.5;
  }
  .field-error { color: var(--danger); font-size: 12.5px; margin: 0; }

  .text-input, .num-input, .enum-select, .raw-input {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--panel-alt);
    color: var(--text);
    width: 100%;
    max-width: 420px;
  }
  textarea.text-input { max-width: 100%; resize: vertical; }
  .num-input { max-width: 160px; }
  .enum-select { max-width: 260px; }
  .input-invalid { border-color: var(--danger); background: var(--danger-bg); }
  .bool-input { width: 17px; height: 17px; accent-color: var(--accent); }

  .file-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ext-hint { color: var(--text-faint); font-size: 12px; font-family: "JetBrains Mono", monospace; }

  .union-wrap { display: flex; flex-direction: column; gap: 8px; }
  .variant-row { display: flex; align-items: center; gap: 8px; }
  .variant-label { font-size: 12.5px; color: var(--text-dim); }
  .variant-select {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    padding: 4px 8px;
    border: 1px solid var(--accent-dim);
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: 5px;
  }

  .raw-row { display: flex; align-items: center; gap: 8px; background: var(--danger-bg); border-radius: 6px; padding: 6px 8px; }
  .raw-key { font-family: "JetBrains Mono", monospace; color: var(--danger); font-size: 12.5px; min-width: 90px; }
  .unknown-banner { color: var(--danger); font-size: 12px; font-weight: 600; margin-top: 4px; }

  .add-optional-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .add-optional-select {
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--panel-alt);
    color: var(--text);
  }

  .list-field { display: flex; flex-direction: column; gap: 8px; }
  .list-item-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    background: var(--panel-alt);
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .list-index { font-family: "JetBrains Mono", monospace; color: var(--text-faint); font-size: 12px; padding-top: 6px; }
  .list-item-body { flex: 1; min-width: 0; }
  .list-item-content { display: flex; flex-direction: column; gap: 8px; }
  .list-add-row { display: flex; align-items: center; gap: 8px; }

  /* JSON preview */
  .json-preview {
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
    line-height: 1.6;
    background: var(--code-bg);
    color: var(--code-text);
    padding: 16px;
    border-radius: 8px;
    white-space: pre;
    overflow-x: auto;
    margin: 0;
  }

  footer.statusbar {
    padding: 7px 18px;
    padding-bottom: calc(7px + env(safe-area-inset-bottom, 0px));
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .status-error { color: var(--danger); }

  a.source-link { color: var(--accent); text-decoration: none; }
  a.source-link:hover { text-decoration: underline; }

  @media (max-width: 860px) {
    main.layout { flex-direction: column; }
    .pane-left, .pane-right { flex: none; }
    .pane-right { max-height: 50vh; }
  }
</style>

<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">{ }</span>
      <span class="brand-name">PolyFEM Config Editor</span>
    </div>
    <div class="toolbar">
      <button class="btn" id="btn-new">New</button>
      <button class="btn" id="btn-open">Open&hellip;</button>
      <button class="btn btn-primary" id="btn-save">Download JSON</button>
    </div>
    <input type="file" id="file-input" accept=".json,application/json" hidden>
    <span class="current-file" id="current-file">untitled.json</span>
  </header>

  <main class="layout">
    <section class="pane pane-left">
      <div class="pane-header"><span class="pane-title">Config</span></div>
      <div class="pane-body">
        <div id="form-root"></div>
      </div>
    </section>
    <section class="pane pane-right">
      <div class="pane-header">
        <span class="pane-title">JSON preview</span>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-small" id="btn-copy-preview">Copy</button>
          <button class="btn btn-small" id="btn-refresh-preview">Refresh</button>
        </div>
      </div>
      <div class="pane-body">
        <pre class="json-preview" id="json-preview"></pre>
      </div>
    </section>
  </main>

  <footer class="statusbar" id="status-bar">Loading&hellip;</footer>
</div>

<script src="spec-data.js"></script>
<script src="app.js"></script>
